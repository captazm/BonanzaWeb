<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bonanza E-Reader Store | Authorized BOOX Distributor in Myanmar</title>
  <meta name="description"
    content="Bonanza E-Reader Store is the authorized distributor of BOOX e-readers in Myanmar since 2019. Shop premium E Ink devices including Palma, Note, Go, and Tab series." />
  <meta property="og:title" content="Bonanza E-Reader Store | BOOX Authorized Distributor Myanmar" />
  <meta property="og:description"
    content="Myanmar's authorized BOOX distributor since 2019. Premium E Ink e-readers for reading, writing, and mindful living." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="/index.css" />
</head>

<body>
  <canvas id="global-space-canvas" style="position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;"></canvas>
  <div id="app" style="position:relative;z-index:1;"></div>
  <script type="module" src="/main.js"></script>
  <script>
    (function(){
      const c = document.getElementById('global-space-canvas');
      const ctx = c.getContext('2d');
      let stars=[], shooters=[], t=0;

      function init(){
        c.width = window.innerWidth;
        c.height = window.innerHeight;
        stars=[];
        const n = window.innerWidth < 768 ? 100 : 220;
        for(let i=0;i<n;i++) stars.push({
          x:Math.random()*c.width, y:Math.random()*c.height,
          r:Math.random()*1.4+0.2, a:Math.random()*0.85+0.15,
          sp:Math.random()*1.8+0.4, ph:Math.random()*Math.PI*2
        });
      }

      function spawn(){
        if(shooters.length>2) return;
        shooters.push({x:Math.random()*c.width*0.7, y:Math.random()*c.height*0.45,
          vx:5+Math.random()*4, vy:2+Math.random()*2.5,
          len:90+Math.random()*70, life:1});
      }

      function draw(){
        const W=c.width, H=c.height;
        ctx.clearRect(0,0,W,H);
        ctx.fillStyle='#04030a'; ctx.fillRect(0,0,W,H);

        // Milky Way band
        const b=ctx.createLinearGradient(0,H*.15,W,H*.85);
        b.addColorStop(0,'transparent');
        b.addColorStop(0.2,'rgba(90,50,150,0.05)');
        b.addColorStop(0.45,'rgba(110,70,180,0.09)');
        b.addColorStop(0.6,'rgba(80,40,140,0.06)');
        b.addColorStop(1,'transparent');
        ctx.fillStyle=b; ctx.fillRect(0,0,W,H);

        // Nebula glows
        const n1=ctx.createRadialGradient(W*.75,H*.4,0,W*.75,H*.4,W*.35);
        n1.addColorStop(0,'rgba(120,40,200,0.06)'); n1.addColorStop(1,'transparent');
        ctx.fillStyle=n1; ctx.fillRect(0,0,W,H);
        const n2=ctx.createRadialGradient(W*.15,H*.65,0,W*.15,H*.65,W*.25);
        n2.addColorStop(0,'rgba(30,60,180,0.05)'); n2.addColorStop(1,'transparent');
        ctx.fillStyle=n2; ctx.fillRect(0,0,W,H);

        // Stars
        stars.forEach(s=>{
          const a=s.a*(0.55+0.45*Math.sin(t*s.sp+s.ph));
          ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
          ctx.fillStyle=`rgba(255,255,255,${a})`; ctx.fill();
        });

        // Shooting stars
        if(Math.random()<0.006) spawn();
        shooters=shooters.filter(s=>{
          s.x+=s.vx; s.y+=s.vy; s.life-=0.016;
          if(s.life<=0) return false;
          const ang=Math.atan2(s.vy,s.vx);
          const tg=ctx.createLinearGradient(s.x,s.y,s.x-Math.cos(ang)*s.len,s.y-Math.sin(ang)*s.len);
          tg.addColorStop(0,`rgba(255,255,255,${s.life*.9})`);
          tg.addColorStop(0.4,`rgba(180,120,255,${s.life*.4})`);
          tg.addColorStop(1,'transparent');
          ctx.beginPath(); ctx.moveTo(s.x,s.y);
          ctx.lineTo(s.x-Math.cos(ang)*s.len, s.y-Math.sin(ang)*s.len);
          ctx.strokeStyle=tg; ctx.lineWidth=1.5; ctx.stroke();
          return true;
        });

        t+=0.018;
        requestAnimationFrame(draw);
      }

      init(); draw();
      window.addEventListener('resize', init);
    })();
  </script>
</body>

</html>
